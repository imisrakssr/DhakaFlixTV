name: Build DhakaFlix TV APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history + tags, for the release notes

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate assets (fonts, icons, banner, keystore)
        run: |
          pip install --quiet pillow
          bash ci/prepare.sh

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.14.3"

      - name: Build release APKs
        run: gradle assembleRelease --stacktrace
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk out/DhakaFlixTV-v2.0.${{ github.run_number }}-armv7.apk
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk out/DhakaFlixTV-v2.0.${{ github.run_number }}-arm64.apk
          cp app/build/outputs/mapping/release/mapping.txt out/mapping-v2.0.${{ github.run_number }}.txt || true
          ls -la out

      - uses: actions/upload-artifact@v5
        with:
          name: DhakaFlixTV-apk
          path: |
            out/*.apk
            out/*.txt

      - name: Release notes (commits since the last release)
        run: |
          prev=$(git describe --tags --abbrev=0 2>/dev/null || true)
          range=${prev:+$prev..}HEAD
          {
            git log --no-merges --pretty='- %s' $range | head -40
            echo
            echo "Mi TV Stick / most Android TV boxes → **armv7** APK."
            echo "Newer 64-bit phones → arm64 APK."
          } > notes.md
          cat notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: DhakaFlix TV v2.0.${{ github.run_number }}
          body_path: notes.md
          files: out/*.apk
